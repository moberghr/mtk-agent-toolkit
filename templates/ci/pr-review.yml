# MTK Full Review — GitHub Actions workflow template (optional)
#
# Runs the deterministic linter AND a Claude Code AI review on every PR.
# Requires an ANTHROPIC_API_KEY secret. Costs ~$0.05-0.50 per review depending
# on diff size and model routing.
#
# How it works: the target repo does NOT contain the linter or the review
# rubric — both ship with the MTK toolkit. This workflow checks out the toolkit
# alongside your PR and runs its ci-lint.sh + review rubric against your
# checkout. No plugin install and no vendored files are required.
#
# Setup:
#   1. Copy this file to .github/workflows/pr-review.yml in your repo
#   2. Add ANTHROPIC_API_KEY to repo secrets (Settings > Secrets > Actions)
#   3. Commit and push — the workflow runs on every PR to main
#
# The deterministic lint always runs. The AI review runs only after the lint
# passes (no point spending tokens reviewing code with hardcoded secrets), and
# only for same-repo PRs — fork PRs get a read-only token with no access to
# secrets, so they are skipped with an explicit notice instead of failing.

name: MTK Review

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write  # Needed for posting the review comment

jobs:
  lint:
    name: Deterministic Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve MTK toolkit version
        id: mtkver
        run: |
          REF=""
          if [ -f .claude/mtk-version.json ]; then
            V=$(python3 -c 'import json; print(json.load(open(".claude/mtk-version.json")).get("version",""))' 2>/dev/null || true)
            # Only accept a plain version token — a crafted multiline value would
            # inject extra $GITHUB_OUTPUT lines.
            case "$V" in
              ""|*[!0-9A-Za-z.-]*) : ;;
              *) REF="v$V" ;;
            esac
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout MTK toolkit
        uses: actions/checkout@v4
        with:
          repository: moberghr/mtk-agent-toolkit
          ref: ${{ steps.mtkver.outputs.ref }}  # empty => default branch
          path: _mtk
          fetch-depth: 1

      - name: Run MTK linter on PR diff
        run: bash _mtk/scripts/ci-lint.sh --base "${{ github.event.pull_request.base.sha }}"

  ai-review:
    name: AI Review
    needs: lint
    runs-on: ubuntu-latest
    # Skip drafts, and skip fork PRs (no secret access, read-only token).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve MTK toolkit version
        id: mtkver
        run: |
          REF=""
          if [ -f .claude/mtk-version.json ]; then
            V=$(python3 -c 'import json; print(json.load(open(".claude/mtk-version.json")).get("version",""))' 2>/dev/null || true)
            # Only accept a plain version token — a crafted multiline value would
            # inject extra $GITHUB_OUTPUT lines.
            case "$V" in
              ""|*[!0-9A-Za-z.-]*) : ;;
              *) REF="v$V" ;;
            esac
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout MTK toolkit
        uses: actions/checkout@v4
        with:
          repository: moberghr/mtk-agent-toolkit
          ref: ${{ steps.mtkver.outputs.ref }}
          path: _mtk
          fetch-depth: 1

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run AI review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The review rubric travels with the toolkit checkout — no plugin
          # install needed. Feed it to Claude Code verbatim along with the PR
          # diff range. A failure here fails the job (no silent masking).
          RUBRIC="$(cat _mtk/.claude/skills/pre-commit-review/SKILL.md)"
          PROMPT="You are running a pre-commit security and correctness review on a GitHub pull request in the current directory. Review ONLY the changes introduced by this branch: run \`git diff ${BASE_SHA}...HEAD\` to see them. Apply the following MTK pre-commit-review rubric verbatim; do not invent additional rules and do not modify any files.

          --- BEGIN RUBRIC ---
          ${RUBRIC}
          --- END RUBRIC ---

          Produce a concise Markdown report. The first line must be exactly 'VERDICT: PASS' or 'VERDICT: NEEDS_CHANGES'. Follow with a bulleted findings list (file:line, severity, issue, fix). If there are no findings, say so."
          claude -p "$PROMPT" \
            --allowedTools "Read,Grep,Glob,Bash" \
            --output-format text \
            > review.md
          echo "--- AI review report ---"
          cat review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file review.md

  fork-notice:
    name: AI Review (skipped for fork)
    needs: lint
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Explain skip
        run: |
          echo "::notice::AI review skipped for this fork PR — fork PRs run with a read-only token and no access to ANTHROPIC_API_KEY. The deterministic lint still ran. A maintainer can re-run the review from a same-repo branch."
