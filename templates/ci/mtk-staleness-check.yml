# MTK Staleness Check — GitHub Actions workflow template
#
# Fails the PR when MTK-generated artifacts (CLAUDE.md, architecture-principles.md,
# conventions.md, detected-tools.json, AGENTS.md, path references) have drifted
# from source, backed by `scripts/setup-refresh-plan.sh --check` (read-only, no
# side effects). The toolkit itself is checked out fresh, pinned to the version
# recorded in this repo's .claude/mtk-version.json — this repo never vendors a
# copy of MTK's scripts (D5, docs/specs/2026-07-03-v719-setup-improvements.md).
#
# Setup:
#   1. Copy this file to .github/workflows/mtk-staleness-check.yml in your repo
#      (setup-bootstrap offers to install it for you — see SKILL.md STEP 4)
#   2. Push — the workflow runs on every PR to main, plus on-demand via
#      workflow_dispatch
#
# On failure: run `/mtk-setup --refresh` locally, review the diff, commit, push.

name: MTK Staleness Check

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect MTK Install
    runs-on: ubuntu-latest
    outputs:
      bootstrapped: ${{ steps.read-version.outputs.bootstrapped }}
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Read installed MTK version
        id: read-version
        run: |
          if [ ! -f .claude/mtk-version.json ]; then
            echo "::notice::.claude/mtk-version.json not found — this repo has not been bootstrapped with MTK (run /mtk-setup). Skipping staleness check."
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$(python3 -c "import json; print(json.load(open('.claude/mtk-version.json')).get('version', ''))")"
          if [ -z "$VERSION" ]; then
            echo "::error::.claude/mtk-version.json has no 'version' field — cannot resolve which toolkit tag to check against."
            exit 2
          fi
          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  staleness-check:
    name: Setup Refresh Plan
    needs: detect
    if: needs.detect.outputs.bootstrapped == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # dependency rescan + AGENTS.md diff need full repo state

      - name: Checkout MTK toolkit at pinned version
        id: checkout-toolkit
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: moberghr/mtk-agent-toolkit
          ref: v${{ needs.detect.outputs.version }}
          path: .mtk-toolkit
          fetch-depth: 1

      - name: Fallback — checkout toolkit default branch
        # The toolkit repo may not tag every version. If the pinned tag
        # doesn't exist, fall back to the default branch rather than failing
        # the whole workflow on a packaging gap.
        if: steps.checkout-toolkit.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: moberghr/mtk-agent-toolkit
          path: .mtk-toolkit
          fetch-depth: 1

      - name: Warn on fallback
        if: steps.checkout-toolkit.outcome == 'failure'
        run: echo "::warning::No tag v${{ needs.detect.outputs.version }} found in moberghr/mtk-agent-toolkit — fell back to the default branch. The staleness check may not exactly match your installed version."

      - name: Run setup-refresh-plan --check
        run: |
          # Default shell on ubuntu-latest runners is already bash; `set +e`
          # is required here so pipefail doesn't abort the step before we can
          # inspect the script's exit code below.
          set +e
          bash .mtk-toolkit/scripts/setup-refresh-plan.sh --check | tee plan.md
          rc=${PIPESTATUS[0]}
          case "$rc" in
            0)
              exit 0
              ;;
            1)
              {
                echo "## MTK setup staleness plan"
                echo
                echo '```'
                cat plan.md
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::run /mtk-setup --refresh to reconcile"
              exit 1
              ;;
            2)
              echo "::error::setup-refresh-plan.sh --check exited with a usage/setup error (exit 2) — check the toolkit checkout and repo state."
              exit 1
              ;;
            *)
              echo "::error::setup-refresh-plan.sh --check exited unexpectedly (exit $rc)."
              exit 1
              ;;
          esac
