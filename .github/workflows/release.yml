name: Release on Version Bump

# Fires on every push to main. Reads the version from .claude/manifest.json,
# verifies it matches .claude-plugin/plugin.json (C0.1 / S1.4), and — if no tag
# for that version exists yet — creates the tag and a GitHub release with notes
# pulled from the matching CHANGELOG.md section. Pushes that don't bump the
# version create no tag or release (the tag already exists); every run still
# rebuilds the slim plugin branch from that tag, which is a no-op when unchanged.
# A version bump is tagged only after the `eval` job (native `claude plugin eval`,
# tag `core`, needs the ANTHROPIC_API_KEY secret) passes its threshold.

on:
  push:
    branches: [main]

permissions:
  contents: write

# Overlapping release runs (two quick merges to main) queue instead of racing on the
# tag and the append-only plugin branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Behavioural gate: the native plugin-eval suite (evals/, tag `core`) must reach the
  # threshold before a version is tagged. It runs only when this push bumps the version
  # (no tag yet), so ordinary merges to main do not pay for a full eval run; on those the
  # job succeeds without running cases and the release job only rebuilds the plugin
  # branch from the already-gated tag.
  eval:
    name: Plugin eval suite (core)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CLAUDE_CODE_VERSION: "2.1.296"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, to tell a version bump from an ordinary push

      - name: Check whether this push is a release
        id: check
        run: |
          V=$(grep -m1 '"version"' .claude/manifest.json | tr -d ' ",' | sed 's/version://')
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$V already exists: no release on this push, eval skipped."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "No tag for v$V yet: running the eval gate."
          fi

      - name: Install Claude Code and sandbox prerequisites
        if: steps.check.outputs.release == 'true'
        run: |
          # Granting Bash to eval runs requires the OS sandbox: bubblewrap + socat on Linux.
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04 blocks unprivileged user namespaces by default, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
          git --version

      - name: Run plugin eval suite
        if: steps.check.outputs.release == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . --tag core --scaffold --allow-tools Bash Write Edit \
            --model claude-sonnet-5-5 --judge-model claude-haiku-5-5 \
            --threshold 0.8 --max-cost-usd 20 \
            --no-publish --trust-plugin --json eval-results.json

      - name: Upload eval results
        if: always() && steps.check.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-results
          path: eval-results.json
          if-no-files-found: warn

  release:
    name: Tag and release on version bump
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags so we can detect existing releases

      - name: Read and verify version
        id: ver
        run: |
          MV=$(grep -m1 '"version"' .claude/manifest.json | tr -d ' ",' | sed 's/version://')
          PV=$(grep -m1 '"version"' .claude-plugin/plugin.json | tr -d ' ",' | sed 's/version://')
          if [ -z "$MV" ]; then echo "::error::Could not read version from .claude/manifest.json"; exit 1; fi
          if [ "$MV" != "$PV" ]; then
            echo "::error::Version mismatch (C0.1/S1.4): manifest.json=$MV plugin.json=$PV"; exit 1
          fi
          echo "version=$MV" >> "$GITHUB_OUTPUT"
          echo "Manifest/plugin version: $MV"

      - name: Check whether tag already exists
        id: check
        run: |
          V="${{ steps.ver.outputs.version }}"
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$V already exists — nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No tag for v$V yet — will tag and release."
          fi

      - name: Build release notes and title
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          V="${{ steps.ver.outputs.version }}"
          # Extract the CHANGELOG section for this version (between its header and the next "## [").
          # index() match is literal so dots in the version aren't treated as regex.
          awk -v ver="$V" 'BEGIN{f=0}
            /^## \[/ { if (f) exit; if (index($0, "[" ver "]")) { f=1; next } }
            f { print }' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for $V — falling back to the release commit message."
            git log -1 --format=%B > notes.md
          fi
          # Title: strip a conventional-commit prefix off the release commit subject;
          # ensure the version appears.
          RAW=$(git log -1 --format=%s)
          TITLE=$(printf '%s' "$RAW" | sed -E 's/^[a-z]+(\([^)]*\))?: *//')
          case "$TITLE" in
            *"v$V"*) ;;
            *) TITLE="v$V — $TITLE" ;;
          esac
          # Guard against an empty title.
          [ -n "$TITLE" ] || TITLE="v$V"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Release title: $TITLE"

      - name: Create tag and GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          # Annotated tags need a committer identity; the runner has none by default.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          git push origin "v$V"
          gh release create "v$V" --title "${{ steps.notes.outputs.title }}" --notes-file notes.md
          echo "Released v$V"

      # The Claude plugin directory tracks the `plugin` branch: validating the whole repo
      # times out, so the script builds a slim runtime-only tree and appends one commit per
      # release (history preserved) so the directory scans each version.
      # Self-healing: this step runs on every push to main, not only on a version bump. It
      # builds from tag v$V (created above, or by an earlier release), the script is
      # idempotent, and the push is a no-op when nothing changed — so a publish that failed
      # or was skipped heals on the next run. Manual recovery from a checkout:
      #   bash scripts/build-plugin-branch.sh --source vX.Y.Z && git push origin refs/heads/plugin:refs/heads/plugin
      - name: Build and push the slim plugin branch
        run: |
          V="${{ steps.ver.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::Tag v$V does not exist (did tag creation fail?) — cannot build the plugin branch"; exit 1
          fi
          # commit-tree needs a committer identity; the tag step sets it only when it runs.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin plugin >/dev/null; then
            git fetch origin plugin:refs/remotes/origin/plugin
          else
            echo "No plugin branch yet — this run creates it."
          fi
          bash scripts/build-plugin-branch.sh --source "v$V" --branch plugin
          # Plain push only: the branch is append-only, never force.
          git push origin refs/heads/plugin:refs/heads/plugin
          echo "Published plugin branch for v$V"
