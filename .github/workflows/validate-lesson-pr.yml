name: validate-lesson-pr

# Validates PRs that touch lessons/contributed/. A lessons-only PR is a
# contribute-back PR (from /lessons promote): it must stay within the file and
# size caps and contain no secrets or prompt-injection markers, and then it is
# labelled `lesson-validated`. A mixed PR (a maintainer change that also edits
# lessons/contributed/) is reviewed as ordinary code. Its lesson files still get
# the secret and injection scans, and it is never labelled.
#
# It NEVER merges. A human reviews and merges. The label is a green light, not
# an action. Permissions are deliberately minimal: no `contents: write`.

on:
  pull_request:
    paths:
      - 'lessons/contributed/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate contributed lesson
        id: validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # --- Classify the PR --------------------------------------------
          # The path filter fires for any PR touching lessons/contributed/,
          # including maintainer PRs that also edit the toolkit (e.g. the
          # README format note). Only a lessons-only PR is a contribute-back
          # PR: it gets the whitelist, the caps and the label. A mixed PR is
          # reviewed as ordinary code, but its lesson files still get the
          # secret and injection scans below, and it never gets the label.
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          lesson_files="$(printf '%s\n' "$changed" | awk '/^lessons\/contributed\//')"
          offenders="$(printf '%s\n' "$changed" | awk 'NF && !/^lessons\/contributed\//')"
          echo "Contributed-lesson files:"; echo "${lesson_files:-<none>}"

          if [ -n "$offenders" ]; then
            mode=mixed
            echo "::notice::PR also changes $(printf '%s\n' "$offenders" | awk 'NF' | wc -l | tr -d ' ') file(s) outside lessons/contributed/, so it is not a contribute-back PR. Skipping the whitelist and caps; scanning the lesson files only; no lesson-validated label."
          else
            mode=contribute-back

            # --- File-count cap (<= 2) ------------------------------------
            count="$(printf '%s\n' "$lesson_files" | awk 'NF' | wc -l | tr -d ' ')"
            if [ "$count" -gt 2 ]; then
              echo "::error::contribute-back PR touches $count files; cap is 2 (one lesson + optional README)."
              exit 1
            fi

            # --- Size cap (<= 20 KB total added content) ------------------
            total_bytes=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              [ -f "$f" ] || continue
              sz="$(wc -c < "$f" | tr -d ' ')"
              total_bytes=$((total_bytes + sz))
            done <<< "$lesson_files"
            echo "Total bytes: $total_bytes"
            if [ "$total_bytes" -gt 20480 ]; then
              echo "::error::contributed files total ${total_bytes}B; cap is 20480B (20 KB)."
              exit 1
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          # --- Secret-shape scan ------------------------------------------
          secret_hits=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            if grep -nEi \
              -e '(api[_-]?key|secret|password|passwd|token|bearer)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9/_+-]{12,}' \
              -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              -e '(AKIA|ASIA)[A-Z0-9]{16}' \
              -e 'gh[pousr]_[A-Za-z0-9]{20,}' \
              -e '(Server|Data Source)=[^;]+;[^;]*Password=' \
              "$f"; then
              secret_hits=1
            fi
          done <<< "$lesson_files"
          if [ "$secret_hits" -ne 0 ]; then
            echo "::error::Possible secret material detected in contributed lesson. Re-run the anonymization checklist."
            exit 1
          fi

          # --- Prompt-injection marker scan -------------------------------
          inj_hits=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            if grep -nEi \
              -e 'ignore (all|previous|prior) (instructions|prompts)' \
              -e 'disregard (the|all|previous)' \
              -e 'you are now' \
              -e '<\/?(system|assistant)>' \
              -e 'system prompt' \
              "$f"; then
              inj_hits=1
            fi
          done <<< "$lesson_files"
          if [ "$inj_hits" -ne 0 ]; then
            echo "::error::Possible prompt-injection content detected in contributed lesson."
            exit 1
          fi

          echo "All checks passed ($mode)."

      # Decorations only — the label and comment are a green light, not a gate.
      # They must NEVER fail an otherwise-passing PR: fork PRs get a read-only
      # GITHUB_TOKEN, and the label may not exist yet. So this step is
      # best-effort (continue-on-error + no `set -e`, each action `|| notice`).
      # The hard validation lives in the step above and stays fatal.
      - name: Label validated (best-effort)
        if: success() && steps.validate.outputs.mode == 'contribute-back'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail   # deliberately NOT -e: decorations must not fail the job

          # Create the label if missing (no-op when it exists; tolerated when the
          # token is read-only, e.g. on a fork PR).
          if ! gh label list --limit 200 2>/dev/null | grep -q '^lesson-validated'; then
            gh label create "lesson-validated" \
              --color "0e8a16" \
              --description "Contribute-back lesson passed automated validation" \
              2>/dev/null \
              || echo "::notice::could not create 'lesson-validated' label (read-only token on a fork PR?) — skipping."
          fi

          gh pr edit "$PR" --add-label "lesson-validated" 2>/dev/null \
            || echo "::notice::could not add 'lesson-validated' label (unknown label or read-only token) — validation still passed."

          gh pr comment "$PR" --body "✅ Contribute-back checks passed (path whitelist, size cap, secret scan, injection scan). A maintainer will review and merge — this workflow does not auto-merge." 2>/dev/null \
            || echo "::notice::could not post success comment (read-only token on a fork PR?) — validation still passed."
